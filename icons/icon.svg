<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Sun -->
  <circle cx="200" cy="200" r="60" fill="#FFD700" opacity="0.9"/>
  <circle cx="200" cy="200" r="70" fill="#FFD700" opacity="0.2"/>
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="200" y1="110" x2="200" y2="90"/>
    <line x1="200" y1="290" x2="200" y2="310"/>
    <line x1="110" y1="200" x2="90" y2="200"/>
    <line x1="290" y1="200" x2="310" y2="200"/>
    <line x1="136" y1="136" x2="122" y2="122"/>
    <line x1="264" y1="264" x2="278" y2="278"/>
    <line x1="136" y1="264" x2="122" y2="278"/>
    <line x1="264" y1="136" x2="278" y2="122"/>
  </g>
  <!-- Cloud -->
  <path d="M280 280 
           C280 250, 310 240, 330 250 
           C340 220, 380 220, 390 250 
           C420 245, 440 270, 430 290 
           C440 310, 420 330, 390 330 
           L290 330 
           C270 330, 260 310, 280 280Z" 
        fill="rgba(255,255,255,0.85)"/>
  <!-- Rain drops -->
  <g fill="#64B5F6" opacity="0.7">
    <path d="M310 340 Q315 360 310 370 Q305 360 310 340Z"/>
    <path d="M340 340 Q345 365 340 375 Q335 365 340 340Z"/>
    <path d="M370 340 Q375 360 370 370 Q365 360 370 340Z"/>
  </g>
  <!-- Moon crescent (small, top-right) -->
  <circle cx="370" cy="150" r="25" fill="#E0E0E0" opacity="0.15"/>
  <circle cx="378" cy="145" r="22" fill="url(#bg)"/>
</svg>